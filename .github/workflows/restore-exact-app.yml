name: Restore exact App.jsx

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact App.jsx
        run: |
          cat restore-parts/part1.txt restore-parts/part2.txt restore-parts/part3.txt > restore-parts/full.b64
          base64 -d restore-parts/full.b64 | gzip -d > App.jsx
          rm -rf restore-parts App.source.gz.b64 .github/workflows/restore-exact-app.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restaurar App.jsx exacto"
          git push
